<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOGARCH</title>
<meta name="theme-color" content="#171512">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap">
<style>
:root{--bg:#faf8f5;--bg2:#efebe4;--card:#fff;--tx:#1c1a17;--tx2:#5f5a50;--tx3:#8a8478;--bd:rgba(0,0,0,.12);--bd2:rgba(0,0,0,.3);--gold:#c9a96a;--gold2:#8a6d2f;--acc:#185FA5;--accbg:#E6F1FB;--red:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a17;--bg2:#2a2823;--card:#24221e;--tx:#f1eee8;--tx2:#bdb7aa;--tx3:#8d877a;--bd:rgba(255,255,255,.14);--bd2:rgba(255,255,255,.35);--gold2:#e0c58b;--acc:#8fbbe8;--accbg:#1c3550}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:var(--tx)}
button{background:transparent;border:.5px solid var(--bd2);border-radius:12px;padding:10px 12px;cursor:pointer}
button:active{transform:scale(.98)}
input,select{background:var(--card);border:.5px solid var(--bd2);border-radius:12px;padding:9px 12px;min-height:42px;max-width:100%}
input[type=color]{padding:2px;min-height:42px}
#app{max-width:680px;margin:0 auto;min-height:100vh;padding-bottom:110px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border-bottom:.5px solid var(--bd)}
.top .t{flex:1;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600;line-height:1.1;min-width:0}
.top .t small{display:block;font:12px Inter,sans-serif;color:var(--tx2)}
.ib{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:14px;position:relative;border-color:transparent;flex:none}
.ib svg,.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on svg{fill:var(--red);stroke:var(--red)}
.bdg{position:absolute;top:1px;right:1px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.welcome{margin:10px 12px;padding:9px 14px;border:1.5px solid var(--acc);border-radius:99px;text-align:center;font-style:italic;color:var(--acc);font-size:14px}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 12px}
.room{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 10px;border:.5px solid transparent;border-radius:18px;background:transparent}
.room.on{border-color:var(--gold);background:var(--card);box-shadow:0 8px 20px -14px rgba(0,0,0,.5)}
.room svg{width:100%;max-width:120px;height:auto}
.room b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.room i{font-style:normal;font-size:11px;color:var(--tx3)}
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:.5px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.fbar .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;padding:12px 8px;border-radius:14px;text-align:center;font-weight:500;text-decoration:none;display:block}
.pri{background:var(--gold);border-color:var(--gold);color:#1b1a17}
.sec{border-color:var(--acc);color:var(--acc)}
.act3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#171512;border-radius:0}
.act3 button{border:0;border-radius:0;color:#f1eee8;background:#171512;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.act3 button+button{border-left:.5px solid rgba(255,255,255,.15)}
.act3 button.on{background:#2c2618;color:var(--gold)}
.act3 svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.srch{display:flex;gap:8px;padding:10px 12px 4px}
.srch input{flex:1;border-radius:99px;min-width:0}
.srch button{border-radius:99px;white-space:nowrap;border-color:var(--gold);color:var(--gold2)}
.fil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 12px}
.fil select{width:100%;border-radius:99px}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 12px}
@media(min-width:560px){.tgrid{grid-template-columns:repeat(3,1fr)}}
.tc{padding:0;text-align:left;border:.5px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--card);position:relative}
.tc.on{outline:2.5px solid var(--gold)}
.tc canvas{display:block;width:100%;aspect-ratio:1.5;object-fit:cover}
.tc .sz{position:absolute;right:0;top:calc(100%/1.5*1 - 26px);top:0;background:rgba(23,21,18,.82);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:0 0 0 10px}
.tc .m{padding:6px 9px 9px;font-size:12px;line-height:1.35}
.tc .m b{display:block;font-size:13px;font-weight:600}
.tc .m span{color:var(--tx2);display:block}
.selp{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:.5px solid var(--bd2);padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -10px 24px -16px rgba(0,0,0,.5)}
.selp .in{max-width:680px;margin:0 auto}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{padding:0;border-radius:12px;overflow:hidden;text-align:center;border:1.5px dashed var(--bd2);position:relative;background:var(--bg2)}
.slot.on{border:2px solid var(--gold)}
.slot canvas{display:block;width:100%;aspect-ratio:1.3}
.slot .e{display:grid;place-items:center;aspect-ratio:1.3;font-size:11px;color:var(--tx3);font-style:italic;padding:2px}
.slot b{display:block;font-size:11px;padding:2px 0;background:var(--card)}
.slot .x{position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;display:grid;place-items:center;line-height:1}
.selp .row2{display:flex;gap:8px;margin-top:8px}
.cvw{position:relative;margin:0 auto;max-width:680px}
#cv{display:block;width:100%;aspect-ratio:5/4;background:var(--bg2);touch-action:none;cursor:grab}
.cvi{position:absolute;left:10px;top:8px;font-size:11px;color:#fff;background:rgba(23,21,18,.6);padding:2px 8px;border-radius:99px;pointer-events:none}
.hs{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;padding:0;border-radius:50%;background:#fff;border:2.5px solid var(--gold);color:#1b1a17;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.4);animation:pl 1.6s infinite}
.tp{position:absolute;transform:translate(-50%,-125%);display:flex;align-items:center;gap:6px;background:rgba(23,21,18,.92);padding:6px;border-radius:99px;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.4)}.tp button{height:38px;padding:0 14px;border-radius:99px;font-size:13px;background:#fff;color:#1b1a17;border:0}.tp button:disabled{opacity:.4}.tp button.pen{width:44px;padding:0;display:grid;place-items:center;background:var(--gold)}.tp svg{width:18px;height:18px;stroke:#1b1a17;fill:none;stroke-width:2}
.hd{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;border:2.5px solid var(--gold);display:grid;place-items:center;touch-action:none;z-index:4;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:ew-resize}.hd i{font-style:normal;font-weight:700;font-size:16px;color:#1b1a17}.hd span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(23,21,18,.85);color:#fff;border-radius:99px;padding:1px 6px;white-space:nowrap}
.fbar .in.act3{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.act3 button{justify-content:center;text-align:center}
.fv .top,.fv .tabs,.fv .chips,.fv .msg,.fv .leg,.fv .fbar,.fv #cvi{display:none!important}.fv .cvw{position:fixed;inset:0;max-width:none;margin:0;z-index:40;background:#fff}.fv #cv{aspect-ratio:auto!important;width:100vw!important;height:100vh!important}
.hs svg{width:18px;height:18px;stroke:#1b1a17;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hs span{position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(23,21,18,.8);color:#fff;border-radius:99px;padding:1px 7px;white-space:nowrap}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(201,169,106,.6)}50%{box-shadow:0 0 0 9px rgba(201,169,106,0)}}
.tabs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;align-items:center}
.tab{min-width:54px;padding:9px 12px;border-radius:12px;font-weight:600;flex:none}
.tab.on{background:var(--gold);border-color:var(--gold);color:#1b1a17}
.chips{display:flex;gap:6px;padding:0 12px 6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:99px;font-size:13px;display:flex;gap:5px;align-items:center}
.chip.on{border-color:var(--gold);background:var(--gold);color:#1b1a17}
.chip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;padding:4px 12px}
.leg div{display:flex;gap:8px;align-items:center;font-size:12px;border:.5px solid var(--bd);border-radius:12px;padding:5px;background:var(--card)}
.leg canvas{width:56px;height:56px;border-radius:10px;flex:none}
.leg b{display:block;font-size:12px}
.leg span{color:var(--tx2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:680px;max-height:88vh;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;overflow:hidden}
.sh .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.sh .bd{overflow:auto;padding:4px 16px 8px;flex:1}
.sh .ft{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:.5px solid var(--bd)}
.xb{width:34px;height:34px;padding:0;border-radius:50%;background:var(--red);border-color:var(--red);color:#fff;display:grid;place-items:center}
.xb svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{padding:0;border-radius:14px;overflow:hidden;background:var(--card);text-align:center}
.pc.on{outline:2.5px solid var(--gold)}
.pc canvas{display:block;width:100%;aspect-ratio:240/165}
.pc b{display:block;font-size:12px;font-weight:500;padding:3px 0 5px}
.lbl{font-size:13px;color:var(--tx2);margin:12px 0 6px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stp{display:flex;align-items:center;gap:8px;margin:6px 0}
.stp label{flex:1;font-size:14px}
.stp button{width:38px;height:38px;padding:0;font-size:20px;border-radius:12px}
.stp b{min-width:64px;text-align:center;font-weight:500}
.sw{display:flex;gap:8px;align-items:center;padding:6px;text-align:left;border-radius:12px;background:var(--card)}
.sw.on{outline:2.5px solid var(--gold)}
.sw canvas{width:42px;height:42px;border-radius:8px;flex:none}
.sw span{font-size:12px;line-height:1.3}
.dot{width:36px;height:36px;border-radius:50%;padding:0}
.dot.on{outline:2.5px solid var(--gold);outline-offset:2px}
.card{border:.5px solid var(--bd);border-radius:16px;background:var(--card);padding:12px;margin:10px 12px}
.row{display:flex;gap:10px;align-items:center}
.th{width:84px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg2)}
.pu{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:0 12px}
.pu div{position:relative;border-radius:14px;overflow:hidden;background:#222;color:#fff}
.pu canvas{display:block;width:100%;aspect-ratio:1.1}
.pu p{margin:0;position:absolute;left:0;right:0;bottom:0;padding:6px 8px;background:rgba(0,0,0,.6);font-size:11px}
.pu p b{display:block;font-size:12px;text-transform:uppercase}
.shop{background:#000;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.shop b{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;color:var(--gold)}
.shop span{font-size:12px;text-align:right}
.green{background:#2e9e4f;border-color:#2e9e4f;color:#fff}
.msg{font-size:12px;color:var(--tx2);padding:4px 14px;min-height:20px}
.empty{text-align:center;color:var(--tx3);padding:40px 20px}
pre.q{white-space:pre-wrap;word-break:break-word;font:13px/1.55 Inter,sans-serif;margin:0}
#adm{display:none;padding:12px}
.lbl2{font-size:12px;color:var(--tx2);margin:0 0 2px}
.mini{padding:6px 10px;font-size:13px}
#print{display:none}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;color:#000;background:#fff}}
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
#app{min-height:100dvh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.fbar .in:not(.act3){flex-wrap:wrap}.btn{min-width:0}
@media(min-width:768px){#app{max-width:980px}.fbar .in,.selp .in{max-width:980px}.cvw{max-width:100%}#cv{aspect-ratio:16/10}
.rooms{gap:14px}.tgrid{grid-template-columns:repeat(4,1fr)}.pg{grid-template-columns:repeat(4,1fr)}
.sh{max-width:760px;max-height:84vh;border-radius:22px}.ov{align-items:center}.top{padding:10px 16px}.welcome{font-size:16px}}
@media(min-width:1100px){#app{max-width:1100px}.fbar .in,.selp .in{max-width:1100px}}
.hm{background:#fff;color:#000;min-height:100dvh;font-family:Montserrat,Inter,system-ui,sans-serif}
.hm .ht{display:flex;align-items:flex-start;justify-content:space-between;padding:8px 10px 0;min-height:64px}
.hm .hg{display:flex;align-items:center;gap:4px}
.hbt{background:none;border:0;padding:4px;color:#000;border-radius:10px;display:grid;place-items:center;position:relative;flex:none}
.hbt.hv{display:flex;align-items:center;gap:6px;padding:0 4px;align-self:flex-start;margin-top:-8px}
.hv .vt{background:#4a90e2;width:36px;height:52px;border-radius:0 0 16px 16px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.hv .vp{width:30px;height:30px;border-radius:50%;background:#000;display:grid;place-items:center}
.hv .vp svg{width:20px;height:20px}
.hv .vx{display:flex;flex-direction:column;align-items:flex-start;line-height:1;text-align:left}
.hv .vx small{font-size:15px;font-weight:500;letter-spacing:.04em}
.hv .vx b{font-size:20px;font-weight:700;margin-top:2px}
.hbd{position:absolute;top:-2px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:#ff5722;color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.hdash{width:36px;height:5px;background:#000;border-radius:3px;margin:0 6px;flex:none}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:6px;row-gap:34px;padding:40px 10px 20px;max-width:900px;margin:0 auto}
.hrm{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:#000;border-radius:16px}

.hb{background:#fff;border-top:1px solid #000}

@media(min-width:768px){
.hm .ht{zoom:1.3;padding:14px 22px 0}
.hbr{padding-top:0}.hbr .hlogo{width:72px;height:72px;margin-bottom:10px}
.hgrid{padding:36px 64px 40px;column-gap:48px;row-gap:60px;max-width:1100px}
.hrm .hic{width:min(100%,200px)}
.hrm b{font-size:22px;letter-spacing:.05em}
.hb .act3 button{padding:16px 6px;font-size:16px;gap:6px}
.hb .act3 svg{width:32px;height:32px}
.hm .msg{font-size:15px}}
@media(min-width:1100px){.hgrid{padding-top:44px;row-gap:70px}.hrm .hic{width:min(100%,220px)}}

.pc{box-shadow:0 2px 8px -3px rgba(0,0,0,.3)}
.npv{position:relative;border-radius:14px;overflow:hidden;border:.5px solid var(--bd);background:#fff}
.npv canvas{display:block;width:100%;aspect-ratio:480/330}
.nb{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid #8a8a8a;color:#111;font-weight:700;font-size:16px;padding:0;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}

.chip.on#rtour{background:var(--gold);color:#1a1712}.chip svg{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.fvd{display:none;position:fixed;top:10px;right:10px;z-index:60;min-width:40px;height:40px;border:0;background:none;padding:0;color:#fff;font:600 14px sans-serif;text-shadow:0 0 3px rgba(0,0,0,.9)}.fvd svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px rgba(0,0,0,.85))}.fv.cine .fvd{display:block}
.etl{float:right;margin-left:auto;display:flex;gap:6px}.fvb{display:none;position:fixed;top:10px;left:10px;z-index:60;width:40px;height:40px;border:0;background:none;padding:0}.fvb svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px rgba(0,0,0,.85))}.fv .uh{display:none!important}.fv .fvb{display:block}
.cvi{display:none!important}.dpad{position:absolute;right:8px;bottom:8px;width:96px;height:96px;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}.dpad button{pointer-events:auto;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.14);display:grid;place-items:center;padding:0;touch-action:none}.dpad svg{width:18px;height:18px;opacity:.5;filter:drop-shadow(0 0 2px rgba(0,0,0,.5));stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.dpad [data-m=u]{grid-area:1/2}.dpad [data-m=l]{grid-area:2/1}.dpad [data-m=r]{grid-area:2/3}.dpad [data-m=d]{grid-area:3/2}body.cine .dpad{display:none}.rdim{text-align:center;font-size:13px;opacity:.8;padding:6px 0}

<style>

:root[data-theme="dark"]{--bg:#1b1a17;--bg-neutral:#2a2823;--bg-field:#24221e;--bg-accent:#1c3550;--text-primary:#f1eee8;--text-secondary:#bdb7aa;--text-muted:#8d877a;--text-accent:#8fbbe8;--border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.35);--border-accent:#8fbbe8;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--text-primary);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:var(--text-primary)}
button{background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:10px 12px;cursor:pointer}
button:active{transform:scale(.98)}
input,select{background:var(--bg-field);border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:8px 10px;min-height:40px;box-sizing:border-box;max-width:100%}
input[type=range]{padding:0;min-height:0;background:none;border:none;accent-color:var(--text-accent)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--border-accent);outline-offset:1px}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.brand{font-size:22px;font-weight:600;margin:0 0 12px;font-family:"Cormorant Garamond",Georgia,serif;letter-spacing:.2px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500&display=swap">
<style>
#brand{cursor:pointer}
.hero{border-radius:22px;padding:22px 20px;margin:2px 0 18px;color:#f1eee8;background:radial-gradient(120% 120% at 100% 0%,#5a4a2a 0%,#2a251c 45%,#171512 100%);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border:1px solid rgba(201,169,106,.35);transform:rotate(45deg)}
.hero small{letter-spacing:.28em;font-size:11px;color:#c9a96a;text-transform:uppercase}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:38px;line-height:1.05;margin:6px 0 8px;letter-spacing:.5px}
.hero p{margin:0;font-size:14px;color:#cfc8b8;max-width:28ch}
.hero .pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.hero .pl span{border:0.5px solid rgba(201,169,106,.55);color:#e6d3a8;border-radius:99px;padding:3px 10px;font-size:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}.sec b{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600}.sec span{font-size:12px;color:var(--text-secondary)}
.rg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rc{display:block;width:100%;text-align:left;padding:0;border:0.5px solid var(--border);border-radius:18px;background:var(--bg-field);overflow:hidden;box-shadow:0 10px 22px -16px rgba(0,0,0,.45);animation:up .45s both;animation-delay:calc(var(--i)*60ms)}

.rc .meta{padding:6px 12px 12px;border-top:0.5px solid var(--border)}
.rc b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;font-weight:600;line-height:1.2}
.rc i{display:block;font-style:normal;font-size:12px;color:var(--text-secondary)}
.rc em{display:flex;justify-content:space-between;font-style:normal;font-size:11px;color:var(--text-accent);margin-top:6px}

@media (prefers-reduced-motion:reduce){.rc{animation:none}}
.foot{text-align:center;font-size:12px;color:var(--text-muted);margin:18px 0 6px}
</style>

function toBlob(c){return new Promise(function(r){c.toBlob(r,'image/png')})}
function saveBlob(b,name){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},5000)}

async function saveVideo(){

 var c=document.createElement('canvas'),w=480,h=360,dpr=2,DUR=9000;renderInto(c,.65,.45,1,'360 tour',w,h,dpr);

  rec.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};

  await new Promise(function(res){(function f(t){var k=Math.min(1,(t-t0)/DUR);renderInto(c,.65+k*2*Math.PI,.45,1,'360 tour',w,h,dpr);tmsg('Recording 360 video... '+Math.round(k*100)+'%');if(k<1)requestAnimationFrame(f);else res()})(t0)});
  rec.stop();await done;var ext=/mp4/.test(rec.mimeType||mt)?'mp4':'webm',blob=new Blob(ch,{type:(rec.mimeType||mt||'video/webm').split(';')[0]});
